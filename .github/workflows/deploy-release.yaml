name: Deploy release

on:
  release:
    types:
      - published

jobs:
  deploy:
    uses: croct-tech/shared-public-configs/.github/workflows/publish-public-npm-package.yml@master
    with:
      # The caller's `env` block is not propagated to reusable workflows, so the
      # constants are resolved by the script itself, from `release-config.mjs`.
      prepare-script: node prepare-release.mjs

  cdn:
    if: ${{ !github.event.release.prerelease }}
    needs: deploy
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: 23
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve release constants
        run: node release-config.mjs >> "$GITHUB_ENV"

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Bundle package
        run: |-
          rm -rf build
          npm run bundle -- --config-cdn-url=${CDN_URL} \
              --config-preview-widget-origin=${PREVIEW_WIDGET_ORIGIN} \
              --config-preview-widget-url=${PREVIEW_WIDGET_URL}

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v3'
        with:
          workload_identity_provider: '${{ secrets.GCLOUD_WORKLOAD_IDENTITY }}'
          service_account: '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to GCS
        env:
          GCLOUD_BUCKET: ${{ secrets.GCLOUD_BUCKET }}
        run: |-
          gsutil -m cp build/plug.min.js "gs://${GCLOUD_BUCKET}/js/v1/lib/plug.js"
          gsutil -m setmeta -h "Cache-Control: public, max-age=3600" "gs://${GCLOUD_BUCKET}/js/v1/lib/plug.js"

  preview-widget:
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read  # This is required for actions/checkout
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Resolve release constants
        working-directory: .
        run: node release-config.mjs >> "$GITHUB_ENV"

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v5
        with:
          path: preview/node_modules
          key: preview_node_modules-${{ hashFiles('preview/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build package
        run: npm run build

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ secrets.GCLOUD_WORKLOAD_IDENTITY }}'
          service_account: '${{ secrets.GCLOUD_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to GCS
        env:
          GCLOUD_BUCKET: ${{ secrets.GCLOUD_BUCKET }}
        run: |-
          gsutil -m cp dist/widget.html "gs://${GCLOUD_BUCKET}/${PREVIEW_WIDGET_PATH}"
          gsutil -m setmeta -h "Cache-Control: public, max-age=3600" "gs://${GCLOUD_BUCKET}/${PREVIEW_WIDGET_PATH}"
